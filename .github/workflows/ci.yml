name: CI — E2E Visual & Accessibility Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Lint & Type-check ─────────────────────────────────────────────────────
  # Always runs — keeps the badge green when no app is deployed yet.
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run typecheck

  # ── Check whether an app URL is configured ───────────────────────────────
  # Outputs a flag that downstream jobs use to decide whether to run.
  check-secrets:
    name: Check secrets
    runs-on: ubuntu-latest
    outputs:
      has-app: ${{ steps.check.outputs.has-app }}
      has-percy: ${{ steps.check.outputs.has-percy }}
      has-chromatic: ${{ steps.check.outputs.has-chromatic }}
    steps:
      - name: Detect configured secrets
        id: check
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$BASE_URL" ]; then
            echo "has-app=true" >> $GITHUB_OUTPUT
          else
            echo "has-app=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$PERCY_TOKEN" ]; then
            echo "has-percy=true" >> $GITHUB_OUTPUT
          else
            echo "has-percy=false" >> $GITHUB_OUTPUT
          fi
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "has-chromatic=true" >> $GITHUB_OUTPUT
          else
            echo "has-chromatic=false" >> $GITHUB_OUTPUT
          fi

  # ── Cross-browser E2E Tests ───────────────────────────────────────────────
  # Only runs when BASE_URL secret is set.
  e2e:
    name: E2E Tests — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: [lint, check-secrets]
    if: needs.check-secrets.outputs.has-app == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests on ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }} --reporter=github,html
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # ── Accessibility Tests ───────────────────────────────────────────────────
  # Only runs when BASE_URL secret is set.
  a11y:
    name: Accessibility Tests (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: [lint, check-secrets]
    if: needs.check-secrets.outputs.has-app == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npx playwright test --grep @a11y --project=chromium --reporter=github,html
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload a11y HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 30

  # ── Percy Visual Tests ────────────────────────────────────────────────────
  # Only runs when BASE_URL and PERCY_TOKEN secrets are both set.
  percy:
    name: Percy Visual Regression
    runs-on: ubuntu-latest
    needs: [e2e, check-secrets]
    if: |
      needs.check-secrets.outputs.has-app == 'true' &&
      needs.check-secrets.outputs.has-percy == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Percy visual tests
        run: npm run percy:exec
        env:
          CI: true
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

  # ── Chromatic Storybook Visual Tests ─────────────────────────────────────
  # Only runs when CHROMATIC_PROJECT_TOKEN secret is set.
  chromatic:
    name: Chromatic — Storybook Visual Review
    runs-on: ubuntu-latest
    needs: [lint, check-secrets]
    if: |
      needs.check-secrets.outputs.has-chromatic == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        run: npm run chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
